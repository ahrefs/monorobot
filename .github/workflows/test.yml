name: build and test

on:
  - push
  - pull_request

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        ocaml-compiler:
          - 5.4

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          allow-prerelease-opam: true

      # the runner image's apt index can reference package versions the mirror no longer serves
      - run: sudo apt-get update

      - run: opam install . ocamlformat.0.29.0

      - name: compile
        run: opam exec -- make

      - name: run test
        run: opam exec -- make test

      - name: check ocamlformat
        run: opam exec -- make fmt
