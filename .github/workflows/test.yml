name: build and test

on:
  - push
  - pull_request

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        ocaml-compiler:
          - 5.5

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          allow-prerelease-opam: true

      # the runner image's apt index can reference package versions the mirror no longer serves
      - run: sudo apt-get update

      # Database.Conn needs execute_unprepared, which no sqlgg release on opam has yet (latest is 20260721)
      - run: opam pin add --no-action sqlgg https://github.com/ygrek/sqlgg.git#4133b17aa201977864d4747fbb24fb2cb8e0757d

      - run: opam install . ocamlformat.0.29.0

      - name: compile
        run: opam exec -- make

      - name: run test
        run: opam exec -- make test

      - name: check ocamlformat
        run: opam exec -- make fmt
